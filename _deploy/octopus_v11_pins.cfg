##################################################################
# BTT Octopus V1.1 (STM32F446) mainboard pin overrides
##################################################################
## Must be the LAST include: Klipper parses with strict=False, so options
## re-declared here win over the Formbot fragments in 0_Xplorer/01_Default_CFG.
##
## The steppers are NOT here. Every mainboard motor moved to TMC2240, which
## cannot coexist with the [tmc2209] sections in the Formbot fragments, so the
## axes use full replacement files instead:
##   X_Axis_IDEX_octopus.cfg / Y_Axis_1xGantry_octopus.cfg / Z_Axis_octopus.cfg
##
## All DIAG jumpers must be removed from the board, otherwise the STOP headers
## used below are tied to the driver DIAG outputs.
##
## Driver slots in use:  0 X | 1 X1 | 2 Y | 3 Y1 | 4 Z | 5 Z1 | 6 Z2 | 7 free
## Input headers (silkscreen name / pin):
##   X-STOP  PG6  free      Y-STOP  PG9  stepper_y   Z-STOP  PG10 stepper_z
##   Z2-STOP PG11 stepper_z1  E0DET PG12 stepper_z2  E1DET  PG13 tools_calibrate
##   E2DET   PG14 T0 buffer    E3DET PG15 T1 buffer

##################################
# Tool offset contact probe
##################################

[tools_calibrate]
pin: ^PG13

##################################
# Print bed
##################################

[heater_bed]
heater_pin: PA1
sensor_pin: PF3

##################################
# Fans
##################################

[temperature_fan chamber_fan]
pin: PD12
sensor_pin: PF5

[controller_fan Electronics_fan]
pin: PD13

##################################
# Case light / PSU
##################################

[output_pin caselight]
pin: PA2                                     # HE0 — heater output, always Vin (24 V),
                                             # matching HE1 on the Manta. FAN0 is unused.

[output_pin Power]
pin: PE11

##################################
# LLL Buffers
##################################
# Wiring (BTT Octopus V1.1):
#   T0 runout: E2DET (PG14-GND)
#   T0 supply: FAN4  (PD14)
#   T1 runout: E3DET (PG15-GND)
#   T1 supply: FAN5  (PD15)

[output_pin Buffer_T0_power]
pin: PD14

[output_pin Buffer_T1_power]
pin: PD15

[filament_switch_sensor T0_buffer]
switch_pin: ^PG14

[filament_switch_sensor T1_buffer]
switch_pin: ^PG15
