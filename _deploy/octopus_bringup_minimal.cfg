##################################################################
# Octopus V1.1 bring-up config -- MAINBOARD ONLY
##################################################################
## Temporary config for step 3 of the migration: prove the Octopus boots and
## talks to Klipper before any toolboards, Cartographer or macros are involved.
##
## To use, back up printer.cfg and replace its contents with:
##     [include ./01__User_Custom__CFG/octopus_bringup_minimal.cfg]
##
## Toolboards are deliberately absent, so the X/X1 endstops that normally live
## on the EBB36 boards are pointed at the free PG6 header instead. Nothing here
## is meant for printing - swap back to Xplorer_V1.1_IDEX_custom.cfg afterwards.

[include ../02__Boards_Serials/Mainboard_serial.cfg]
[include ../mainsail.cfg]

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 40
max_z_accel: 100

[force_move]
enable_force_move: True

[temperature_sensor Mainboard]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor Host]
sensor_type: temperature_host

##################################
# X -- slot 0 (TMC2240 SPI)
##################################

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 32
rotation_distance: 32
endstop_pin: ^PG6
position_endstop: 0
position_max: 340
position_min: -1
homing_speed: 50

[tmc2240 stepper_x]
cs_pin: PC4
spi_bus: spi1_PA6_PA7_PA5
rref: 12000
run_current: 0.5
interpolate: false
stealthchop_threshold: 0

##################################
# Y -- slot 2 (TMC2240 SPI)
##################################

[stepper_y]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 32
rotation_distance: 40
endstop_pin: ~PG9
position_endstop: 449
position_max: 450
position_min: 0
homing_speed: 50

[tmc2240 stepper_y]
cs_pin: PC6
spi_bus: spi1_PA6_PA7_PA5
rref: 12000
run_current: 0.5
interpolate: true
stealthchop_threshold: 350

##################################
# Z -- slot 4 (TMC2240 SPI)
##################################

[stepper_z]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 32
rotation_distance: 40
gear_ratio: 80:16
endstop_pin: PG10
position_max: 410
position_min: -3
homing_speed: 10

[tmc2240 stepper_z]
cs_pin: PF2
spi_bus: spi1_PA6_PA7_PA5
rref: 12000
run_current: 0.8
stealthchop_threshold: 999999

##################################
# Bed
##################################

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
min_temp: 0
max_temp: 125
