## kTAMV nozzle-alignment camera — XY tool offset calibration for 2-tool IDEX
## https://github.com/TypQxQ/kTAMV
## Camera: upward-facing USB cam on the bed, streamed by crowsnest [cam nozzle] on port 8081.
## Z offset is NOT measured here — use the contact-probe flow (AUTO_CALIBRATE_tool_offsets)
## or manual paper test for z1offset.
##
## First-time setup:
##   1. SAVE_VARIABLE VARIABLE=camx VALUE=<X of camera center>
##      SAVE_VARIABLE VARIABLE=camy VALUE=<Y of camera center>
##   2. G28, then NOZZLE_CAM_CALIBRATE_OFFSETS

[ktamv]
nozzle_cam_url: http://localhost:8081/?action=snapshot
server_url: http://localhost:8085
move_speed: 1800
send_frame_to_cloud: false
detection_tolerance: 0

[gcode_macro NOZZLE_CAM_CALIBRATE_OFFSETS]
description: Camera-based XY offset calibration: T0 sets origin, T1 offset saved to variables.cfg
gcode:
    {% set svv = printer["save_variables"].variables %}
    {% if svv.camx is not defined or svv.camy is not defined %}
        { action_raise_error("Set camera position first: SAVE_VARIABLE VARIABLE=camx VALUE=... / camy") }
    {% endif %}
    {% if 'xy' not in printer.toolhead.homed_axes %}
        { action_raise_error("Home the printer first (G28)") }
    {% endif %}
    M118 === Camera XY offset calibration ===
    M118 Nozzles MUST be clean and free of ooze!
    # heat to probe temp so nozzles are ooze-brushed like the contact flow
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={svv.tprobe}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={svv.tprobe}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={svv.tprobe} TIMEOUT=300
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={svv.tprobe} TIMEOUT=300
    Brush_Tool0
    Brush_Tool1
    # cool below ooze temp for a clean image
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=140
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=140
    KTAMV_SEND_SERVER_CFG
    # --- T0: calibrate camera mm/px and set origin ---
    Tool0
    G90
    G0 X{svv.camx} Y{svv.camy} F{printer.ktamv.travel_speed|default(1800)}
    M400
    KTAMV_CALIB_CAMERA
    KTAMV_FIND_NOZZLE_CENTER
    _NCC_SET_ORIGIN_IF_OK
    # --- T1: measure offset relative to T0 origin ---
    Tool1
    G90
    G0 X{svv.camx} Y{svv.camy} F{printer.ktamv.travel_speed|default(1800)}
    M400
    KTAMV_FIND_NOZZLE_CENTER
    KTAMV_GET_OFFSET
    _NCC_SAVE_OFFSET_T1
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
    PARK_extruder1
    Tool0

[gcode_macro _NCC_SET_ORIGIN_IF_OK]
gcode:
    {% if printer.ktamv.last_nozzle_center_successful|default("false")|lower == "true" %}
        KTAMV_SET_ORIGIN
    {% else %}
        { action_raise_error("kTAMV could not find T0 nozzle center — check camera view/focus") }
    {% endif %}

[gcode_macro _NCC_SAVE_OFFSET_T1]
description: Save kTAMV-measured T1 XY offset into variables.cfg (same vars as contact-probe flow)
gcode:
    {% if printer.ktamv.last_nozzle_center_successful|default("false")|lower == "true" %}
        {% set off = printer.ktamv.last_calculated_offset %}
        {% set x_offset = off[0]|round(6) %}
        {% set y_offset = off[1]|round(6) %}
        SAVE_VARIABLE VARIABLE=x1offset VALUE={x_offset}
        SAVE_VARIABLE VARIABLE=y1offset VALUE={y_offset}
        M118 Saved camera offsets T1: X{x_offset} Y{y_offset} (z1offset unchanged)
    {% else %}
        { action_raise_error("kTAMV could not find T1 nozzle center — offsets NOT saved") }
    {% endif %}
