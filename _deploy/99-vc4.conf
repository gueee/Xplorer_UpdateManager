# Pi 5 / Debian trixie: force the KMS "modesetting" driver for the vc4 GPU
# so Xorg does not fall into framebuffer mode (fbdev) and abort with
# "Cannot run in framebuffer mode. Please specify busIDs".
# Install to /etc/X11/xorg.conf.d/99-vc4.conf
Section "OutputClass"
    Identifier "vc4"
    MatchDriver "vc4"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection
